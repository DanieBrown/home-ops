# EPA Map of Radon Zones -- North Carolina
#
# Authority:  https://www.epa.gov/sites/default/files/2014-08/documents/north_carolina.pdf
#             (the EPA map itself is a map image, not a machine-readable table)
# Transcribed county-by-county listing of that map: https://radonlevels.org/state/nc
# State measured data / program:
#   https://ncdhhs.gov/divisions/health-service-regulation/north-carolina-radon-program/nc-radon-data
#
# Verified 2026-08-11. The zone totals below (8 / 31 / 61 across 100 counties)
# match the EPA distribution reported independently at
# https://mapscaping.com/radon-zones-north-carolina/ -- scripts/tests/test-site-hazards.mjs
# asserts those counts so a bad edit to this file fails the suite.
#
# Zone meanings (predicted average INDOOR radon screening level for the county):
#   1  -- at or above 4 pCi/L   (highest potential)   -- 8 counties
#   2  -- 2 to 4 pCi/L          (moderate potential)  -- 31 counties
#   3  -- below 2 pCi/L         (low potential)       -- 61 counties
#
# This is a county-level screening predictor, not a measurement. Zone 3 does
# NOT mean a given house is safe, and Zone 1 does not mean a given house is
# elevated -- only a test of the specific home measures its actual level.
# site-hazards-check.mjs renders that caveat alongside the zone.
#
# Keys are lowercase county names with no "County" suffix, matching the key
# style of config/county-arcgis-registry.yml. The dataset is stable; this file
# needs no live query.

