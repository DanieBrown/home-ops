county_sources:
  counties:
    wake:
      label: Wake County, NC
      services:
        - key: wake-development
          name: Wake County Development (subdivisions)
          url: https://maps.wake.gov/arcgis/rest/services/Planning/Wake_County_Development/FeatureServer/0
          dateField: APPLICATIONDATE
          outFields: CASEID,CASENUMBER,WORK_CLASS,APPLICATIONDATE,DESCRIPTION,PLAN_STATUS,SUBDIVISION_NAME,PROPOSED_NO_LOTS,NUMBER_OF_ACRES
          recordKind: subdivision-case
        - key: wake-zoning
          name: Wake County Zoning Cases
          url: https://maps.wake.gov/arcgis/rest/services/Planning/Zoning/FeatureServer/0
          dateField: null
          outFields: "*"
          recordKind: zoning
          skipDateFilter: true

hoa:
  known_seeds:
    - key: 7040-rex-rd-holly-springs-nc-avocet
      addressPattern:
        pattern: "\\b7040\\s+rex\\s+rd\\b"
        flags: i
      cityPattern:
        pattern: "\\bholly\\s+springs\\b"
        flags: i
      communityPattern:
        pattern: "\\bavocet\\b"
        flags: i
      communityName: Avocet
      associationName: Avocet Home Owners Association
      managementCompany: Community Association Services, Inc.
      urls:
        - label: CAS Avocet community page
          url: https://www.casnc.com/communities/avocet/
          kind: management-page
